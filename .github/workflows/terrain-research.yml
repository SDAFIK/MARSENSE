name: MARSENSE V3 terrain research
on:
  push:
    branches: ['codex/marsense-v3-intelligence']
    paths: ['ai/train_candidate.py', 'ai/research_gate.py', '.github/workflows/terrain-research.yml']
  workflow_dispatch:
    inputs:
      epochs:
        description: Research training epochs
        default: "4"
        required: true
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Audit genuine data and train research candidate
        env:
          EPOCHS: ${{ inputs.epochs || '4' }}
        run: |
          python -m ai.train_candidate data/nasa/ai4mars/manifests/6ec2a90869202f2719ce0fc33084ef094436371df271b163241251869ce8468e.json research-output/deeplab.pt --epochs "$EPOCHS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-only-terrain-candidate
          path: research-output/
          retention-days: 3
