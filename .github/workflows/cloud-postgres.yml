name: MARSENSE cloud PostgreSQL validation
on:
  push:
    branches: ['codex/cloud-migration-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marsense
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: marsense
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marsense"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt -r backend/requirements-cloud.txt
      - run: python -m pytest -q tests/test_cloud_store.py
        env:
          MARSENSE_TEST_POSTGRES_URL: postgresql://marsense:isolated-ci-only@localhost:5432/marsense
