name: Public website acceptance
on:
  push:
    branches: [codex/marsense-public-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify public domain without Vercel login
        working-directory: frontend
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const origin='https://redscape-eight.vercel.app';
          const browser=await chromium.launch({args:['--enable-unsafe-swiftshader']});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            let ready=false;
            for(let i=0;i<8;i++){
              try{const r=await page.goto(origin,{timeout:30000});if(r?.ok() && await page.getByRole('button',{name:'Launch Live Demo',exact:true}).isVisible()){ready=true;break;}}catch{}
              await page.waitForTimeout(10000);
            }
            assert(ready,'Public landing page unavailable');
            const health=await page.request.get(origin+'/api/health');
            assert(health.ok());assert.equal((await health.json()).status,'ok');
            await page.getByRole('button',{name:'Launch Live Demo',exact:true}).click();
            await page.getByRole('tab',{name:'EXPECT',exact:true}).waitFor({timeout:90000});
            await page.getByRole('tab',{name:'OBSERVE',exact:true}).click();
            await page.getByRole('button',{name:'Analyze terrain',exact:true}).click();
            await page.getByRole('tab',{name:'VERIFY',exact:true}).click();
            await page.getByRole('region',{name:'Evidence review'}).getByRole('button',{name:'Confirm observation'}).click();
            await page.getByRole('heading',{name:'Route Beta',exact:true}).waitFor({timeout:30000});
            await page.getByLabel('Active mission').selectOption('eva-02');
            await page.getByText('INHERITED FROM EVA-01',{exact:false}).waitFor({timeout:30000});
            await page.screenshot({path:'public-desktop.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            await page.getByRole('link',{name:'Astronaut View',exact:true}).click();
            await page.getByRole('region',{name:'Ground observation view'}).waitFor();
            assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'Mobile overflow');
            await page.screenshot({path:'public-mobile.png',fullPage:true});
            assert.deepEqual(errors,[]);
            console.log('Public unauthenticated desktop/mobile mission acceptance passed');
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-website-screenshots
          path: frontend/public-*.png
