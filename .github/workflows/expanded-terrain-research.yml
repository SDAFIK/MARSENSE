name: MARSENSE expanded cross-rover research
on:
  push:
    branches: ['codex/marsense-v3-terrain-research']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install isolated CPU research environment
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install torch==2.15.0+cpu torchvision==0.29.2+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Acquire fresh site-disjoint training and evaluation subset
        run: python -m scripts.expand_ai4mars
      - name: Train and independently evaluate candidate
        run: python -m ai.train_candidate data/nasa/ai4mars/expanded-v3.json research-output/expanded-deeplab.pt --epochs 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: expanded-cross-rover-research
          path: |
            research-output/
            data/nasa/ai4mars/expanded-v3.json
          retention-days: 3
