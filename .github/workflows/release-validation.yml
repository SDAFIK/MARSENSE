name: MARSENSE release validation

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marsense-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install backend and CPU AI dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements-dev.txt
          .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -r ai/requirements.txt
      - name: Backend and scientific regression tests
        run: |
          # The genuine checkpoint is a private, uncommitted scientific artifact.
          # Its separate provenance/inference gate must be run with the actual artifact.
          .venv/bin/python -m pytest -q --ignore=tests/test_s2_genuine_model.py
          echo "Optional genuine-checkpoint gate NOT RUN: ai/checkpoints/ is not in Git."
      - name: Backend lint
        run: .venv/bin/python -m ruff check backend ai scripts tests
      - name: Backend type checks
        run: .venv/bin/python -m mypy backend ai
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend type checks
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend component tests
        working-directory: frontend
        run: npm run test
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        working-directory: frontend
        run: npm run test:e2e
      - name: Authenticated browser acceptance
        working-directory: frontend
        run: npx playwright test --config=playwright.auth.config.ts
      # Keep raw browser traces and session-bearing reports on the ephemeral runner.
