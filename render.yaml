# Optional staging deployment. Review plan and resource limits before provisioning.
services:
  - type: web
    name: marsense-cloud-api
    runtime: docker
    plan: free
    region: singapore
    branch: codex/marsense-cloud-migration
    dockerfilePath: ./backend/Dockerfile.cloud
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: MARSENSE_ENVIRONMENT
        value: production
      - key: MARSENSE_DATABASE_URL
        sync: false
      - key: MARSENSE_CORS_ORIGINS
        value: '["https://redscape-5d9fw6ccz-sadib-dewans-projects.vercel.app","https://redscape-git-codex-marsense-cloud-a18fd2-sadib-dewans-projects.vercel.app","https://redscape-sadib-dewans-projects.vercel.app","https://redscape-eight.vercel.app","https://desktop-sdfik.tailf13324.ts.net","https://redscape-nee4e0pk0-sadib-dewans-projects.vercel.app"]'
